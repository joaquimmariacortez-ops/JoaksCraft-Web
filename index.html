<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>JoaksCraft Web</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            #62b5e8 0%,
            #9ddcff 58%,
            #78c850 59%,
            #4d9b32 100%
        );
}

/* Céu */
#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 24px;
    height: 24px;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
    box-shadow: 0 0 2px black;
}

#crosshair::before {
    width: 24px;
    height: 2px;
    top: 11px;
    left: 0;
}

#crosshair::after {
    width: 2px;
    height: 24px;
    left: 11px;
    top: 0;
}

/* Joystick */
#joystick {
    position: absolute;
    left: 25px;
    bottom: 30px;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: rgba(0,0,0,.25);
    border: 3px solid rgba(255,255,255,.45);
}

#stick {
    position: absolute;
    width: 65px;
    height: 65px;
    left: 40px;
    top: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
    border: 3px solid white;
}

/* Botões */
.buttons {
    position: absolute;
    right: 20px;
    bottom: 25px;
    display: grid;
    grid-template-columns: repeat(2, 75px);
    gap: 12px;
}

.button {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.7);
    background: rgba(0,0,0,.35);
    color: white;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.button:active {
    background: rgba(255,255,255,.35);
}

/* Barra superior */
#top {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    color: white;
    text-shadow: 2px 2px 3px black;
    font-size: 17px;
    pointer-events: none;
}

#status {
    color: #8cff8c;
}

/* Inventário */
#inventory {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(90%, 500px);
    padding: 20px;
    background: rgba(20,20,20,.94);
    border: 3px solid #aaa;
    border-radius: 12px;
    color: white;
    display: none;
}

#inventory h2 {
    margin-top: 0;
    text-align: center;
}

.slots {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.slot {
    aspect-ratio: 1;
    border: 2px solid #777;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}
</style>
</head>

<body>

<div id="game">

    <div id="top">
        <div>🟩 JoaksCraft Web</div>
        <div id="status">● ONLINE</div>
    </div>

    <div id="crosshair"></div>
